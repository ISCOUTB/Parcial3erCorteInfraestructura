#cloud-config
# Instala la app de demostración como servicio systemd.
# No requiere Internet: usa solo python3 de la imagen de Ubuntu.
write_files:
  - path: /opt/demo/app.py
    permissions: "0755"
    content: |
      ${app}
  - path: /etc/systemd/system/demo-app.service
    permissions: "0644"
    content: |
      [Unit]
      Description=App demo escalamiento/HA
      After=network-online.target

      [Service]
      ExecStart=/usr/bin/python3 /opt/demo/app.py
      Restart=always
      RestartSec=2
      Environment=APP_PORT=80

      [Install]
      WantedBy=multi-user.target

runcmd:
  - systemctl daemon-reload
  - systemctl enable --now demo-app.service
