name: Terraform destroy

on:
  workflow_dispatch:
    inputs:
      confirm_destroy:
        description: "Confirmar que deseas eliminar toda la infraestructura de CaribeShop"
        required: true
        type: choice
        options:
          - "no"
          - "yes"
        default: "no"

permissions:
  contents: read

concurrency:
  group: terraform-destroy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fmt:
    name: Terraform format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.6
      - name: Check formatting
        run: terraform fmt -check -recursive

  validate:
    name: Terraform validate (${{ matrix.directory }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        directory:
          - caribeshop/terraform
          - demo-escalamiento/terraform
    defaults:
      run:
        working-directory: ${{ matrix.directory }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.6
      - name: Initialize providers
        run: terraform init -backend=false -input=false
      - name: Validate configuration
        run: terraform validate -no-color

  checkov:
    name: Checkov
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Checkov
        run: python -m pip install --disable-pip-version-check checkov
      - name: Scan Terraform
        run: checkov --directory . --framework terraform --config-file .checkov.yaml --quiet

  destroy-plan:
    name: Azure Terraform destroy plan
    if: github.ref == 'refs/heads/master' && inputs.confirm_destroy == 'yes'
    needs:
      - fmt
      - validate
      - checkov
    runs-on: ubuntu-latest
    concurrency:
      group: caribeshop-terraform-state
      cancel-in-progress: false
    defaults:
      run:
        working-directory: caribeshop/terraform
    env:
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      OPERATOR_IPS: ${{ vars.OPERATOR_IPS }}
      ALERT_EMAIL: ${{ vars.ALERT_EMAIL }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.6
      - name: Preview infrastructure destruction
        run: bash ../../.github/scripts/terraform-azure.sh destroy-plan

  destroy:
    name: Azure Terraform destroy
    if: github.ref == 'refs/heads/master' && inputs.confirm_destroy == 'yes'
    needs:
      - fmt
      - validate
      - checkov
      - destroy-plan
    runs-on: ubuntu-latest
    environment: azure-apply
    concurrency:
      group: caribeshop-terraform-state
      cancel-in-progress: false
    defaults:
      run:
        working-directory: caribeshop/terraform
    env:
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      OPERATOR_IPS: ${{ vars.OPERATOR_IPS }}
      ALERT_EMAIL: ${{ vars.ALERT_EMAIL }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.6
      - name: Destroy infrastructure after approval
        run: bash ../../.github/scripts/terraform-azure.sh destroy
