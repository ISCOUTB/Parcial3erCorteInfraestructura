name: Terraform checks

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: terraform-checks-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  fmt:
    name: Terraform format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.6
      - name: Check formatting
        run: terraform fmt -check -recursive

  validate:
    name: Terraform validate (${{ matrix.directory }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        directory:
          - caribeshop/terraform
          - demo-escalamiento/terraform
    defaults:
      run:
        working-directory: ${{ matrix.directory }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.6
      - name: Initialize providers
        run: terraform init -backend=false -input=false
      - name: Validate configuration
        run: terraform validate -no-color

  checkov:
    name: Checkov
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Checkov
        run: python -m pip install --disable-pip-version-check checkov
      - name: Scan Terraform
        run: checkov --directory . --framework terraform --config-file .checkov.yaml --quiet

  terraform-plan:
    name: Azure Terraform plan
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
    needs:
      - fmt
      - validate
      - checkov
    runs-on: ubuntu-latest
    concurrency:
      group: caribeshop-terraform-state
      cancel-in-progress: false
    defaults:
      run:
        working-directory: caribeshop/terraform
    env:
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      OPERATOR_IPS: ${{ vars.OPERATOR_IPS }}
      ALERT_EMAIL: ${{ vars.ALERT_EMAIL }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.6
      - name: Run Azure Terraform plan
        run: bash ../../.github/scripts/terraform-azure.sh plan

  terraform-apply:
    name: Azure Terraform apply
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs:
      - fmt
      - validate
      - checkov
      - terraform-plan
    runs-on: ubuntu-latest
    environment: azure-apply
    concurrency:
      group: caribeshop-terraform-state
      cancel-in-progress: false
    defaults:
      run:
        working-directory: caribeshop/terraform
    env:
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      OPERATOR_IPS: ${{ vars.OPERATOR_IPS }}
      ALERT_EMAIL: ${{ vars.ALERT_EMAIL }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.6
      - name: Run confirmed Azure Terraform apply
        run: bash ../../.github/scripts/terraform-azure.sh apply
