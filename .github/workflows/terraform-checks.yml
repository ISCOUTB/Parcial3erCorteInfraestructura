name: Terraform checks

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: terraform-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fmt:
    name: Terraform format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.6
      - name: Check formatting
        run: terraform fmt -check -recursive

  validate:
    name: Terraform validate (${{ matrix.directory }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        directory:
          - caribeshop/terraform
          - demo-escalamiento/terraform
    defaults:
      run:
        working-directory: ${{ matrix.directory }}
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.6
      - name: Initialize providers
        run: terraform init -backend=false -input=false
      - name: Validate configuration
        run: terraform validate -no-color

  checkov:
    name: Checkov
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Checkov
        run: python -m pip install --disable-pip-version-check checkov
      - name: Scan Terraform
        run: checkov --directory . --framework terraform --config-file .checkov.yaml --quiet
